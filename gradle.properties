# Hive Project Configuration Properties
# ======================================
#
# This file contains project-wide configuration properties for the Hive
# utilities library. These properties are used throughout the Gradle build
# scripts.
#
# Usage in build.gradle.kts:
#   val projectName = project.properties.get("project.name")
#

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------

# Project name
project.name=Hive

# Project group identifier (reverse domain notation)
project.group=kaishiro.hive

# Project version (semantic versioning: major.minor.patch)
project.version=1.1.0

# Project description
project.description=An advanced general-purpose utilities library for Kotlin

# -----------------------------------------------------------------------------
# Gradle Configuration
# -----------------------------------------------------------------------------
# For production use, consider adding:
#   org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
#   org.gradle.caching=true
#   org.gradle.parallel=true
